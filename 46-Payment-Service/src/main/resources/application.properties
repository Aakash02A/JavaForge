spring.application.name=payment-service
server.port=${SERVER_PORT:8082}

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:paymentdb}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=${RABBITMQ_CONNECTION_TIMEOUT:2s}

app.messaging.payment-exchange=${PAYMENT_EXCHANGE:payment.events}
app.outbox.publish-interval=${OUTBOX_PUBLISH_INTERVAL:1000}
