spring.application.name=order-service
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.instance.prefer-ip-address=true

server.port=${SERVER_PORT:8081}

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:orderdb}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

product-service.base-url=${PRODUCT_SERVICE_URL:http://PRODUCT-SERVICE}
product-service.discovery-enabled=${PRODUCT_SERVICE_DISCOVERY_ENABLED:true}
