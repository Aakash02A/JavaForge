spring.application.name=oauth-login
spring.datasource.url=jdbc:h2:mem:oauth-login;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Configure real provider credentials outside source control.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:local-learning-client}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:local-learning-secret}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
