spring.application.name=api-gateway
server.port=${SERVER_PORT:8083}

app.services.product-url=${PRODUCT_SERVICE_URL:http://localhost:8080}
app.services.order-url=${ORDER_SERVICE_URL:http://localhost:8081}
app.services.payment-url=${PAYMENT_SERVICE_URL:http://localhost:8082}

spring.cloud.gateway.server.webflux.httpclient.connect-timeout=${GATEWAY_CONNECT_TIMEOUT_MS:2000}
spring.cloud.gateway.server.webflux.httpclient.response-timeout=${GATEWAY_RESPONSE_TIMEOUT:5s}
