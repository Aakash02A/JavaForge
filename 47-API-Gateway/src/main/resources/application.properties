spring.application.name=api-gateway
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
server.port=${SERVER_PORT:8083}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.instance.prefer-ip-address=true

app.services.product-url=${PRODUCT_SERVICE_URL:lb://PRODUCT-SERVICE}
app.services.order-url=${ORDER_SERVICE_URL:lb://ORDER-SERVICE}
app.services.payment-url=${PAYMENT_SERVICE_URL:lb://PAYMENT-SERVICE}

spring.cloud.gateway.server.webflux.httpclient.connect-timeout=${GATEWAY_CONNECT_TIMEOUT_MS:2000}
spring.cloud.gateway.server.webflux.httpclient.response-timeout=${GATEWAY_RESPONSE_TIMEOUT:5s}
