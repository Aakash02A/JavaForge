spring.application.name=jwt-authentication
spring.datasource.url=jdbc:h2:mem:jwt-auth;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Override JWT_SECRET with a private, randomly generated Base64-encoded key outside local development.
security.jwt.secret=${JWT_SECRET:amF2YS1mb3JnZS1sb2NhbC1kZXZlbG9wbWVudC1rZXktbm90LWZvci1wcm9kdWN0aW9u}
security.jwt.expiration=3600000
